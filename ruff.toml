# ruff.toml — 钉住规则集。
#
# 为什么必须显式 select：不同平台的 ruff 构建默认规则集不一致。
# 实测（2026-10-06, Termux ruff 0.16.2）：
#   不加 --select  -> 85 条（UP031/BLE001/PLW1510/S110/SIM115/...，无 E701）
#   --select E4,E7,E9,F -> 22 条（E701/E702/E401/E741，与上面完全无交集）
# 两套集合无交集，说明默认值随构建而变。不钉住，本地 CI 与他人机器会得出不同结论。
#
# 本阶段强制：
#   E9  语法错误
#   F   pyflakes —— 未定义名 / 未用导入 / 重复定义（重构期最有价值）
#   I   import 排序
#   EXE 有 shebang 但文件不可执行
#
# 不在本阶段强制 —— 每一条都有去向，不是静默放过：
#   E4 / E7     单行多语句等风格（E701=13, E702=7, E401=1, E741=1）
#               本代码库刻意紧凑 → P1/P2 拆分重构时统一改写
#   UP031       % 格式化 33 处 → P1/P2 重构时逐个改写（避免动错 % 转义）
#   SIM115      open() 无上下文管理器 6 处 → 同上
#   PLW1510     subprocess.run 缺显式 check 12 处 → 同上
#   PLR1730/RUF007/EXE → P1/P2
#   BLE001      except Exception 21 处 —— **有意为之**：fail-safe 设计
#               （读温度失败必须满速，不能让异常冒泡）。收窄异常类型会改变语义；
#               当前零测试覆盖，测试网建立前不得改动这些 catch。
#   S110        try/except/pass 7 处 —— 同上（ALTER TABLE 重复列、清理失败必须吞掉）
[lint]
select = ["E9", "F", "I", "EXE"]
